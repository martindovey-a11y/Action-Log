<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Action Log</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Action Log" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#002B71" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --navy: #002B71;
    --orange: #EF5A01;
    --paper: #EDEFEC;
    --line: #D4D8D3;
    --line-soft: #EEF0EE;
    --muted: #8A928C;
    --muted-dark: #5A6660;
    --done: #7A7A72;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--navy);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .serif { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .wrap {
    max-width: 1000px; margin: 0 auto;
    padding: 24px 16px 60px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
    padding-left: calc(env(safe-area-inset-left, 0px) + 16px);
    padding-right: calc(env(safe-area-inset-right, 0px) + 16px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
  }
  @media (min-width: 640px) {
    .wrap {
      padding-top: calc(env(safe-area-inset-top, 0px) + 40px);
      padding-left: calc(env(safe-area-inset-left, 0px) + 32px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 32px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
    }
  }

  .header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 16px; margin-bottom: 28px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-left img { height: 48px; width: auto; }
  @media (min-width: 640px) { .header-left img { height: 56px; } }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange); margin-bottom: 4px; }
  h1 { font-size: 30px; font-weight: 600; margin: 0; }
  @media (min-width: 640px) { h1 { font-size: 36px; } }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; }
  .btn {
    padding: 8px 12px; font-size: 14px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: #fff; color: var(--navy);
  }
  .btn-orange { color: var(--orange); }
  .btn-solid { background: var(--navy); color: #fff; border: none; }

  .chip-row {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 7px 14px; font-size: 13px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--navy);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip .dot { margin-right: 0; }

  select {
    font-family: 'Inter', sans-serif; font-size: 12px; border-radius: 6px;
    padding: 4px 8px; border: 1px solid var(--line); background: #fff; color: var(--navy);
    max-width: 140px;
  }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .empty-row { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px; }

  .action-item { border-bottom: 1px solid var(--line-soft); }
  .action-item:last-child { border-bottom: none; }
  .action-main { padding: 14px 16px; cursor: pointer; }
  .action-main:active { background: #FAFAF9; }
  .action-desc { font-size: 15px; line-height: 1.4; color: var(--navy); }
  .action-meta { display: flex; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted-dark); }
  .action-details {
    display: none; padding: 0 16px 14px; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .action-item.open .action-details { display: flex; }
  .action-item.open .action-main { padding-bottom: 6px; }

  .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; display: inline-block; margin-right: 8px; }
  .status-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; }
  .due-cell { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted-dark); white-space: nowrap; }
  .row-actions { white-space: nowrap; margin-left: auto; }
  .icon-btn { background: none; padding: 6px; border-radius: 6px; display: inline-flex; }
  .icon-btn:hover { background: #f3f3f3; }
  .priority-flag { font-size: 13px; }

  .summary { margin-top: 16px; font-size: 12px; color: var(--muted); }

  .section-eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px; }
  .notes-wrap { margin-top: 40px; }
  .note-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
  .note-row:last-child { border-bottom: none; }
  .note-no { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .note-text { font-size: 14px; white-space: pre-wrap; color: var(--navy); }
  .note-date { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 4px; }

  .manage-grid { display: grid; gap: 16px; margin-top: 32px; }
  @media (min-width: 640px) { .manage-grid { grid-template-columns: 1fr 1fr; } }
  .manage-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .manage-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }
  .manage-list { max-height: 160px; overflow-y: auto; }
  .manage-item { display: flex; align-items: center; justify-content: space-between; font-size: 14px; padding: 2px 0; }
  .manage-item .left { display: flex; align-items: center; gap: 8px; }
  .manage-item .sub { color: var(--muted); }

  .backup-row {
    display: flex; justify-content: center; gap: 8px;
    margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line);
  }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(0,43,113,0.45);
  }
  .modal-overlay.open { display: flex; }
  .modal { width: 100%; max-width: 420px; background: #fff; border-radius: 10px; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal.wide { max-width: 640px; }
  .time-grid-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line-soft);
  }
  .time-grid-row:last-child { border-bottom: none; }
  .time-grid-name { flex: 1; font-size: 14px; display: flex; align-items: center; min-width: 0; }
  .time-grid-name span.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time-grid-hours { width: 72px; flex-shrink: 0; }
  .time-grid-note { flex: 1; min-width: 0; }
  .time-grid-row input { padding: 6px 8px; font-size: 13px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .modal-close { background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted-dark); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; color: var(--navy); font-family: 'Inter', sans-serif;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .error-text { font-size: 13px; color: var(--orange); margin-bottom: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff !important; }
    .card, .manage-card { box-shadow: none !important; border: 1px solid #ccc !important; }
    .action-details { display: flex !important; }
    .action-item.open .action-main { padding-bottom: 14px; }
    #timeCard { display: block !important; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-left">
      <img src="apple-touch-icon.png" alt="Charles Ambleside" />
      <div>
        <div class="eyebrow">Charles Ambleside &middot; Client Operations</div>
        <h1 class="serif">Action Log</h1>
      </div>
    </div>
    <div class="btn-row no-print">
      <button class="btn btn-solid" id="btnAddAction">+ Action</button>
      <button class="btn btn-orange" id="btnAddNote">+ Note</button>
      <button class="btn" id="btnAddTime">Time</button>
    </div>
  </div>

  <div class="chip-row no-print" id="customerChips"></div>

  <div class="card" id="actionsList"></div>

  <div class="summary no-print" id="summaryLine"></div>

  <div class="btn-row no-print" style="margin-top:16px;">
    <button class="btn" id="btnAddCustomer">+ Customer</button>
    <button class="btn" id="btnAddProject">+ Project</button>
    <button class="btn" id="btnPrint">Print</button>
  </div>

  <div class="notes-wrap">
    <div class="section-eyebrow">Notes</div>
    <div class="card" id="notesCard"></div>
  </div>

  <div class="notes-wrap">
    <div class="section-eyebrow" style="display:flex; align-items:center; justify-content:space-between;">
      <span>Time Log</span>
      <span style="display:flex; gap:6px;">
        <button class="btn no-print" id="btnToggleTime" style="text-transform:none; letter-spacing:normal; font-size:12px; padding:5px 10px;">Show entries</button>
        <button class="btn no-print" id="btnTimeReport" style="text-transform:none; letter-spacing:normal; font-size:12px; padding:5px 10px;">Time Log (Excel)</button>
      </span>
    </div>
    <div class="card" id="timeCard" style="display:none;"></div>
  </div>

  <div class="manage-grid no-print" id="manageGrid"></div>

  <div class="backup-row no-print">
    <button class="btn" id="btnExport">Export</button>
    <button class="btn" id="btnImport">Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;" />
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<script>
// ---------- Data ----------
var STORE_KEY = "action-log-data";
var state = { customers: [], projects: [], actions: [], notes: [], timeLogs: [] };

function loadState() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) { console.error("Load failed", e); }
  if (!state.customers) state.customers = [];
  if (!state.projects) state.projects = [];
  if (!state.actions) state.actions = [];
  if (!state.notes) state.notes = [];
  if (!state.timeLogs) state.timeLogs = [];
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { console.error("Save failed", e); }
}

function uid(prefix) { return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) {
  if (!iso) return "-";
  var d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-ZA", { day: "2-digit", month: "short", year: "numeric" });
}

var TAB_COLORS = ["#002B71", "#EF5A01", "#35558F", "#B84400", "#001A47", "#F58A44"];
var STATUSES = ["Open", "Done"];
var STATUS_COLOR = { Open: "#EF5A01", Done: "#7A7A72" };

function hashColor(id) {
  var h = 0;
  for (var i = 0; i < id.length; i++) { h = (h * 31 + id.charCodeAt(i)) >>> 0; }
  return TAB_COLORS[h % TAB_COLORS.length];
}
function customerName(id) {
  var c = state.customers.find(function(c) { return c.id === id; });
  return c ? c.name : "-";
}
function projectName(id) {
  var p = state.projects.find(function(p) { return p.id === id; });
  return p ? p.name : "-";
}

// ---------- Filters ----------
var filterCustomer = "all";

function filteredActions() {
  var list = state.actions.filter(function(a) {
    if (filterCustomer !== "all" && a.customerId !== filterCustomer) return false;
    if (a.status === "Done") return false;
    return true;
  });
  list.sort(function(a, b) {
    var pDiff = (b.priority ? 1 : 0) - (a.priority ? 1 : 0);
    if (pDiff !== 0) return pDiff;
    return (a.dueDate || "9999").localeCompare(b.dueDate || "9999");
  });
  return list;
}

// ---------- Rendering ----------
var expandedActions = {};

function render() {
  renderCustomerChips();
  renderActionsList();
  renderSummary();
  renderNotes();
  renderTimeLog();
  renderManageGrid();
  saveState();
}

function renderCustomerChips() {
  var wrap = document.getElementById("customerChips");
  var html = '<button class="chip ' + (filterCustomer === "all" ? "active" : "") + '" onclick="setCustomerFilter(\'all\')">All customers</button>';
  state.customers.forEach(function(c) {
    var active = filterCustomer === c.id;
    html += '<button class="chip ' + (active ? "active" : "") + '" onclick="setCustomerFilter(\'' + c.id + '\')">';
    if (!active) html += '<span class="dot" style="background:' + hashColor(c.id) + '"></span>';
    html += escapeHtml(c.name) + '</button>';
  });
  wrap.innerHTML = html;
}
function setCustomerFilter(id) {
  filterCustomer = id;
  render();
}

function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function toggleAction(id) {
  if (expandedActions[id]) { delete expandedActions[id]; }
  else { expandedActions[id] = true; }
  renderActionsList();
}

function renderActionsList() {
  var container = document.getElementById("actionsList");
  var list = filteredActions();
  if (list.length === 0) {
    var msg = state.actions.length === 0
      ? "No actions yet. Add a customer and project, then log your first action."
      : "Nothing matches the current filters.";
    container.innerHTML = '<div class="empty-row">' + msg + '</div>';
    return;
  }
  var html = "";
  list.forEach(function(a) {
    var open = !!expandedActions[a.id];
    var priorityStyle = a.priority ? "border-left: 3px solid #EF5A01;" : "border-left: 3px solid transparent;";
    var flag = a.priority ? '<span class="priority-flag" title="Priority">[!]</span> ' : "";
    html += '<div class="action-item ' + (open ? "open" : "") + '" style="' + priorityStyle + '">';
    html += '<div class="action-main" onclick="toggleAction(\'' + a.id + '\')">';
    html += '<div class="action-desc">' + flag + escapeHtml(a.description) + '</div>';
    html += '<div class="action-meta"><span class="dot" style="background:' + hashColor(a.customerId) + '"></span>' + escapeHtml(customerName(a.customerId)) + ' &middot; ' + escapeHtml(projectName(a.projectId)) + '</div>';
    html += '</div>';
    html += '<div class="action-details">';
    html += '<span class="status-tag" style="color:' + STATUS_COLOR[a.status] + ';background:' + STATUS_COLOR[a.status] + '18">' + a.status + '</span>';
    html += '<span class="due-cell">Due ' + fmtDate(a.dueDate) + '</span>';
    html += '<span class="row-actions no-print">';
    html += '<button class="icon-btn" onclick="event.stopPropagation(); openActionModal(\'' + a.id + '\')" title="Edit">Edit</button>';
    html += '<button class="icon-btn" onclick="event.stopPropagation(); deleteAction(\'' + a.id + '\')" title="Delete" style="color:#EF5A01">Delete</button>';
    html += '</span>';
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function renderSummary() {
  var el = document.getElementById("summaryLine");
  var list = filteredActions();
  el.textContent = list.length + " of " + state.actions.length + " action" + (state.actions.length === 1 ? "" : "s") + " shown, " + state.customers.length + " customer" + (state.customers.length === 1 ? "" : "s") + ", " + state.projects.length + " project" + (state.projects.length === 1 ? "" : "s");
}

function renderNotes() {
  var card = document.getElementById("notesCard");
  var notes = state.notes.slice().sort(function(a, b) { return b.entryNo - a.entryNo; });
  if (notes.length === 0) {
    card.innerHTML = '<div style="padding:24px 16px;font-size:14px;color:#8A928C;">No standalone notes yet. Use this for anything that is not tied to a customer or project.</div>';
    return;
  }
  var html = "";
  notes.forEach(function(n) {
    html += '<div class="note-row">';
    html += '<span class="note-no">' + String(n.entryNo).padStart(3, "0") + '</span>';
    html += '<div style="flex:1">';
    html += '<div class="note-text">' + escapeHtml(n.text) + '</div>';
    html += '<div class="note-date">' + fmtDate(n.createdAt) + '</div>';
    html += '</div>';
    html += '<div class="no-print" style="display:flex;gap:4px;">';
    html += '<button class="icon-btn" onclick="openNoteModal(\'' + n.id + '\')" title="Edit">Edit</button>';
    html += '<button class="icon-btn" onclick="deleteNote(\'' + n.id + '\')" title="Delete" style="color:#EF5A01">Delete</button>';
    html += '</div>';
    html += '</div>';
  });
  card.innerHTML = html;
}

function renderTimeLog() {
  var card = document.getElementById("timeCard");
  var logs = state.timeLogs.slice().sort(function(a, b) {
    return b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt);
  });
  if (logs.length === 0) {
    card.innerHTML = '<div style="padding:24px 16px;font-size:14px;color:#8A928C;">No time logged yet. Use the Time button to log hours against a customer for a given day.</div>';
    return;
  }
  var html = "";
  logs.forEach(function(t) {
    html += '<div class="note-row">';
    html += '<span class="note-no" style="width:82px;flex-shrink:0;">' + fmtDate(t.date) + '</span>';
    html += '<div style="flex:1">';
    html += '<div class="note-text" style="display:flex;align-items:center;gap:8px;">';
    html += '<span class="dot" style="background:' + hashColor(t.customerId) + '"></span>';
    html += escapeHtml(customerName(t.customerId));
    html += '<span class="due-cell" style="margin-left:auto;">' + t.hours + 'h</span>';
    html += '</div>';
    if (t.note) { html += '<div class="note-date" style="margin-top:4px;">' + escapeHtml(t.note) + '</div>'; }
    html += '</div>';
    html += '<div class="no-print" style="display:flex;gap:4px;">';
    html += '<button class="icon-btn" onclick="openTimeModal(\'' + t.id + '\')" title="Edit">Edit</button>';
    html += '<button class="icon-btn" onclick="deleteTimeLog(\'' + t.id + '\')" title="Delete" style="color:#EF5A01">Delete</button>';
    html += '</div>';
    html += '</div>';
  });
  card.innerHTML = html;
}

function renderManageGrid() {
  var grid = document.getElementById("manageGrid");
  if (state.customers.length === 0 && state.projects.length === 0) { grid.innerHTML = ""; return; }

  var custHtml = state.customers.length === 0
    ? '<div style="font-size:14px;color:#8A928C">None yet.</div>'
    : state.customers.map(function(c) {
        return '<div class="manage-item"><span class="left"><span class="dot" style="background:' + hashColor(c.id) + '"></span>' + escapeHtml(c.name) + '</span><button class="icon-btn" onclick="deleteCustomer(\'' + c.id + '\')" style="color:#EF5A01">Delete</button></div>';
      }).join("");

  var projHtml = state.projects.length === 0
    ? '<div style="font-size:14px;color:#8A928C">None yet.</div>'
    : state.projects.map(function(p) {
        return '<div class="manage-item"><span class="left">' + escapeHtml(p.name) + ' <span class="sub">&middot; ' + escapeHtml(customerName(p.customerId)) + '</span></span><button class="icon-btn" onclick="deleteProject(\'' + p.id + '\')" style="color:#EF5A01">Delete</button></div>';
      }).join("");

  grid.innerHTML =
    '<div class="manage-card"><div class="manage-title">Customers</div><div class="manage-list">' + custHtml + '</div></div>' +
    '<div class="manage-card"><div class="manage-title">Projects</div><div class="manage-list">' + projHtml + '</div></div>';
}

// ---------- CRUD ----------
function addCustomer(name) {
  state.customers.push({ id: uid("cus"), name: name });
  render();
}
function addProject(name, customerId) {
  state.projects.push({ id: uid("prj"), name: name, customerId: customerId });
  render();
}
function upsertAction(fields, editId) {
  if (editId) {
    var idx = state.actions.findIndex(function(x) { return x.id === editId; });
    if (idx > -1) state.actions[idx] = Object.assign({}, state.actions[idx], fields);
  } else {
    var entryNo = state.actions.length ? Math.max.apply(null, state.actions.map(function(x) { return x.entryNo; })) + 1 : 1;
    var newAction = Object.assign({ id: uid("act"), entryNo: entryNo, createdAt: todayISO() }, fields);
    state.actions.push(newAction);
  }
  render();
}
function deleteAction(id) { state.actions = state.actions.filter(function(x) { return x.id !== id; }); render(); }

function upsertNote(fields, editId) {
  if (editId) {
    var idx = state.notes.findIndex(function(x) { return x.id === editId; });
    if (idx > -1) state.notes[idx] = Object.assign({}, state.notes[idx], fields);
  } else {
    var entryNo = state.notes.length ? Math.max.apply(null, state.notes.map(function(x) { return x.entryNo; })) + 1 : 1;
    var newNote = Object.assign({ id: uid("note"), entryNo: entryNo, createdAt: todayISO() }, fields);
    state.notes.push(newNote);
  }
  render();
}
function deleteNote(id) { state.notes = state.notes.filter(function(x) { return x.id !== id; }); render(); }

function upsertTimeLog(fields, editId) {
  if (editId) {
    var idx = state.timeLogs.findIndex(function(x) { return x.id === editId; });
    if (idx > -1) state.timeLogs[idx] = Object.assign({}, state.timeLogs[idx], fields);
  } else {
    var newLog = Object.assign({ id: uid("time"), createdAt: todayISO() }, fields);
    state.timeLogs.push(newLog);
  }
  render();
}
function deleteTimeLog(id) { state.timeLogs = state.timeLogs.filter(function(x) { return x.id !== id; }); render(); }

function deleteCustomer(id) {
  state.customers = state.customers.filter(function(x) { return x.id !== id; });
  state.projects = state.projects.filter(function(x) { return x.customerId !== id; });
  state.actions = state.actions.filter(function(x) { return x.customerId !== id; });
  state.timeLogs = state.timeLogs.filter(function(x) { return x.customerId !== id; });
  if (filterCustomer === id) filterCustomer = "all";
  render();
}
function deleteProject(id) {
  state.projects = state.projects.filter(function(x) { return x.id !== id; });
  state.actions = state.actions.filter(function(x) { return x.projectId !== id; });
  render();
}

document.getElementById("btnPrint").addEventListener("click", function() { window.print(); });

document.getElementById("btnExport").addEventListener("click", function() {
  var payload = JSON.stringify(state, null, 2);
  var blob = new Blob([payload], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = "action-log-backup-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById("btnImport").addEventListener("click", function() {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(evt) {
    var parsed;
    try {
      parsed = JSON.parse(evt.target.result);
    } catch (err) {
      alert("That file isn't valid backup JSON.");
      e.target.value = "";
      return;
    }
    var looksValid = parsed && ["customers", "projects", "actions", "notes"].every(function(key) {
      return Array.isArray(parsed[key]);
    });
    if (!looksValid) {
      alert("That file doesn't look like an Action Log backup.");
      e.target.value = "";
      return;
    }
    if (!Array.isArray(parsed.timeLogs)) parsed.timeLogs = [];
    var proceed = confirm(
      "Import this backup? It contains " + parsed.customers.length + " customers, " +
      parsed.projects.length + " projects, " + parsed.actions.length + " actions, " +
      parsed.notes.length + " notes, " + parsed.timeLogs.length + " time entries.\n\n" +
      "This will replace everything currently in the app."
    );
    if (proceed) {
      state = parsed;
      filterCustomer = "all";
      render();
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

document.getElementById("btnAddNote").addEventListener("click", function() { openNoteModal(); });
document.getElementById("btnAddTime").addEventListener("click", function() { openTimeGridModal(todayISO()); });
document.getElementById("btnTimeReport").addEventListener("click", function() { generateTimeReport(); });
document.getElementById("btnToggleTime").addEventListener("click", function() {
  var card = document.getElementById("timeCard");
  var btn = document.getElementById("btnToggleTime");
  var showing = card.style.display !== "none";
  card.style.display = showing ? "none" : "block";
  btn.textContent = showing ? "Show entries" : "Hide entries";
});

// ---------- Modals ----------
function openModal(html, wide) {
  var box = document.getElementById("modalBox");
  box.innerHTML = html;
  box.classList.toggle("wide", !!wide);
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}
document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target.id === "modalOverlay") closeModal();
});

document.getElementById("btnAddCustomer").addEventListener("click", function() { openCustomerModal(); });
document.getElementById("btnAddProject").addEventListener("click", function() { openProjectModal(); });
document.getElementById("btnAddAction").addEventListener("click", function() { openActionModal(); });

function openCustomerModal() {
  var html = '<div class="modal-head"><h2 class="serif">Add customer</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="field"><label>Customer name</label><input id="mName" placeholder="e.g. Acme Foods" autofocus /></div>';
  html += '<div class="error-text" id="mError" style="display:none;"></div>';
  html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-solid" onclick="submitCustomer()">Save</button></div>';
  openModal(html);
}
function submitCustomer() {
  var name = document.getElementById("mName").value.trim();
  if (!name) return showModalError("Enter a customer name.");
  addCustomer(name);
  closeModal();
}

function openProjectModal() {
  var custOptions = state.customers.length
    ? state.customers.map(function(c) { return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>'; }).join("")
    : '<option value="">No customers yet</option>';
  var html = '<div class="modal-head"><h2 class="serif">Add project</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="field"><label>Customer</label><select id="mCustomer">' + custOptions + '</select></div>';
  html += '<div class="field"><label>Project name</label><input id="mName" placeholder="e.g. Reb A bioconversion trial" autofocus /></div>';
  html += '<div class="error-text" id="mError" style="display:none;"></div>';
  html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-solid" onclick="submitProject()">Save</button></div>';
  openModal(html);
}
function submitProject() {
  var name = document.getElementById("mName").value.trim();
  var customerId = document.getElementById("mCustomer").value;
  if (!name) return showModalError("Enter a project name.");
  if (!customerId) return showModalError("Choose a customer first.");
  addProject(name, customerId);
  closeModal();
}

function openActionModal(editId) {
  var editing = editId ? state.actions.find(function(a) { return a.id === editId; }) : null;
  var custId = (editing && editing.customerId) || (state.customers[0] && state.customers[0].id) || "";
  renderActionModalBody(custId, editing, editId);
}
function renderActionModalBody(selectedCustomerId, editing, editId) {
  var custOptions = state.customers.length
    ? state.customers.map(function(c) {
        return '<option value="' + c.id + '" ' + (c.id === selectedCustomerId ? "selected" : "") + '>' + escapeHtml(c.name) + '</option>';
      }).join("")
    : '<option value="">No customers yet</option>';
  var projForCust = state.projects.filter(function(p) { return p.customerId === selectedCustomerId; });
  var selectedProjectId = (editing && editing.projectId) || (projForCust[0] && projForCust[0].id) || "";
  var projOptions = '<option value="">Select project</option>' + projForCust.map(function(p) {
    return '<option value="' + p.id + '" ' + (p.id === selectedProjectId ? "selected" : "") + '>' + escapeHtml(p.name) + '</option>';
  }).join("");
  var statusOptions = STATUSES.map(function(s) {
    return '<option value="' + s + '" ' + (editing && editing.status === s ? "selected" : "") + '>' + s + '</option>';
  }).join("");

  var html = '<div class="modal-head"><h2 class="serif">' + (editing ? "Edit action" : "Add action") + '</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="field"><label>Customer</label><select id="mCustomer" onchange="onActionCustomerChange(\'' + (editId || "") + '\')">' + custOptions + '</select></div>';
  html += '<div class="field"><label>Project</label><select id="mProject">' + projOptions + '</select></div>';
  html += '<div class="field"><label>Action</label><textarea id="mDescription" rows="3" placeholder="What needs to happen?">' + (editing ? escapeHtml(editing.description) : "") + '</textarea></div>';
  html += '<div class="field-row"><div class="field"><label>Status</label><select id="mStatus">' + statusOptions + '</select></div>';
  html += '<div class="field"><label>Due date</label><input type="date" id="mDueDate" value="' + ((editing && editing.dueDate) || "") + '" /></div></div>';
  html += '<div class="field" style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="mPriority" style="width:auto;" ' + (editing && editing.priority ? "checked" : "") + ' /><label for="mPriority" style="margin:0;">Mark as priority</label></div>';
  html += '<div class="error-text" id="mError" style="display:none;"></div>';
  html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-solid" onclick="submitAction(\'' + (editId || "") + '\')">Save</button></div>';
  openModal(html);
}
function onActionCustomerChange(editId) {
  var custId = document.getElementById("mCustomer").value;
  var editing = editId ? state.actions.find(function(a) { return a.id === editId; }) : null;
  renderActionModalBody(custId, editing, editId);
}
function submitAction(editId) {
  var customerId = document.getElementById("mCustomer").value;
  var projectId = document.getElementById("mProject").value;
  var description = document.getElementById("mDescription").value.trim();
  var status = document.getElementById("mStatus").value;
  var dueDate = document.getElementById("mDueDate").value;
  var priority = document.getElementById("mPriority").checked;
  if (!customerId) return showModalError("Choose a customer.");
  if (!projectId) return showModalError("Choose a project.");
  if (!description) return showModalError("Describe the action.");
  upsertAction({ customerId: customerId, projectId: projectId, description: description, status: status, dueDate: dueDate, priority: priority }, editId || null);
  closeModal();
}

function openNoteModal(editId) {
  var editing = editId ? state.notes.find(function(n) { return n.id === editId; }) : null;
  var html = '<div class="modal-head"><h2 class="serif">' + (editing ? "Edit note" : "Add note") + '</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="field"><label>Note</label><textarea id="mNoteText" rows="5" placeholder="Anything worth keeping that is not tied to a customer or project" autofocus>' + (editing ? escapeHtml(editing.text) : "") + '</textarea></div>';
  html += '<div class="error-text" id="mError" style="display:none;"></div>';
  html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-solid" onclick="submitNote(\'' + (editId || "") + '\')">Save</button></div>';
  openModal(html);
}
function submitNote(editId) {
  var text = document.getElementById("mNoteText").value.trim();
  if (!text) return showModalError("Write something first.");
  upsertNote({ text: text }, editId || null);
  closeModal();
}

function openTimeModal(editId) {
  var editing = editId ? state.timeLogs.find(function(t) { return t.id === editId; }) : null;
  var custOptions = state.customers.length
    ? state.customers.map(function(c) {
        return '<option value="' + c.id + '" ' + (editing && editing.customerId === c.id ? "selected" : "") + '>' + escapeHtml(c.name) + '</option>';
      }).join("")
    : '<option value="">No customers yet</option>';
  var html = '<div class="modal-head"><h2 class="serif">' + (editing ? "Edit time entry" : "Log time") + '</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="field"><label>Customer</label><select id="mCustomer">' + custOptions + '</select></div>';
  html += '<div class="field-row"><div class="field"><label>Date</label><input type="date" id="mDate" value="' + ((editing && editing.date) || todayISO()) + '" /></div>';
  html += '<div class="field"><label>Hours</label><input type="number" id="mHours" step="0.25" min="0" placeholder="e.g. 1.5" value="' + (editing && editing.hours != null ? editing.hours : "") + '" /></div></div>';
  html += '<div class="field"><label>Note (optional)</label><input id="mTimeNote" placeholder="What was the time for?" value="' + (editing ? escapeHtml(editing.note || "") : "") + '" /></div>';
  html += '<div class="error-text" id="mError" style="display:none;"></div>';
  html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-solid" onclick="submitTime(\'' + (editId || "") + '\')">Save</button></div>';
  openModal(html);
}
function submitTime(editId) {
  var customerId = document.getElementById("mCustomer").value;
  var date = document.getElementById("mDate").value;
  var hours = parseFloat(document.getElementById("mHours").value);
  var note = document.getElementById("mTimeNote").value.trim();
  if (!customerId) return showModalError("Choose a customer.");
  if (!date) return showModalError("Pick a date.");
  if (!hours || hours <= 0) return showModalError("Enter hours greater than 0.");
  upsertTimeLog({ customerId: customerId, date: date, hours: hours, note: note }, editId || null);
  closeModal();
}

function findTimeEntry(customerId, date) {
  return state.timeLogs.find(function(t) { return t.customerId === customerId && t.date === date; });
}

function openTimeGridModal(date) {
  if (state.customers.length === 0) {
    var empty = '<div class="modal-head"><h2 class="serif">Log time</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>';
    empty += '<div style="font-size:14px;color:#8A928C;">Add a customer first, then come back to log time.</div>';
    empty += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>';
    openModal(empty, true);
    return;
  }

  var html = '<div class="modal-head"><h2 class="serif">Log time</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>';
  html += '<div class="field"><label>Date</label><input type="date" id="gDate" value="' + date + '" onchange="openTimeGridModal(this.value)" /></div>';
  html += '<div style="max-height:50vh; overflow-y:auto; margin-top:8px;">';

  state.customers.forEach(function(c) {
    var existing = findTimeEntry(c.id, date);
    var hoursVal = existing ? existing.hours : "";
    var noteVal = existing ? escapeHtml(existing.note || "") : "";
    html += '<div class="time-grid-row">';
    html += '<div class="time-grid-name"><span class="dot" style="background:' + hashColor(c.id) + '"></span><span class="label">' + escapeHtml(c.name) + '</span></div>';
    html += '<input type="number" class="time-grid-hours" step="0.25" min="0" placeholder="hrs" data-cust="' + c.id + '" value="' + hoursVal + '" />';
    html += '<input type="text" class="time-grid-note" placeholder="Note (optional)" data-cust="' + c.id + '" value="' + noteVal + '" />';
    html += '</div>';
  });

  html += '</div>';
  html += '<div class="error-text" id="mError" style="display:none;"></div>';
  html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-solid" onclick="saveTimeGrid(\'' + date + '\')">Save all</button></div>';
  openModal(html, true);
}

function saveTimeGrid(date) {
  var hourInputs = document.querySelectorAll(".time-grid-hours");
  var savedCount = 0;
  hourInputs.forEach(function(input) {
    var customerId = input.getAttribute("data-cust");
    var hoursVal = parseFloat(input.value);
    if (!hoursVal || hoursVal <= 0) return;
    var noteInput = document.querySelector('.time-grid-note[data-cust="' + customerId + '"]');
    var note = noteInput ? noteInput.value.trim() : "";
    var existing = findTimeEntry(customerId, date);
    if (existing) {
      existing.hours = hoursVal;
      existing.note = note;
    } else {
      state.timeLogs.push({ id: uid("time"), customerId: customerId, date: date, hours: hoursVal, note: note, createdAt: todayISO() });
    }
    savedCount++;
  });
  if (savedCount === 0) {
    return showModalError("Enter hours for at least one customer.");
  }
  render();
  closeModal();
}

function generateTimeReport() {
  var entries = state.timeLogs;
  if (entries.length === 0) { alert("No time logged yet."); return; }
  if (typeof XLSX === "undefined") { alert("Excel library failed to load - check your connection and try again."); return; }

  var detailRows = entries.slice().sort(function(a, b) {
    return a.date.localeCompare(b.date) || customerName(a.customerId).localeCompare(customerName(b.customerId));
  }).map(function(t) {
    return { Date: t.date, Customer: customerName(t.customerId), Hours: t.hours, Note: t.note || "" };
  });

  var totalsMap = {};
  entries.forEach(function(t) {
    var key = t.date.slice(0, 7) + "|" + customerName(t.customerId);
    totalsMap[key] = (totalsMap[key] || 0) + t.hours;
  });
  var summaryRows = Object.keys(totalsMap).sort().map(function(key) {
    var parts = key.split("|");
    return { Month: parts[0], Customer: parts[1], "Total Hours": Math.round(totalsMap[key] * 100) / 100 };
  });
  var grandTotal = entries.reduce(function(sum, t) { return sum + t.hours; }, 0);
  summaryRows.push({ Month: "", Customer: "GRAND TOTAL", "Total Hours": Math.round(grandTotal * 100) / 100 });

  var wb = XLSX.utils.book_new();
  var wsSummary = XLSX.utils.json_to_sheet(summaryRows);
  var wsDetail = XLSX.utils.json_to_sheet(detailRows);
  wsSummary["!cols"] = [{ wch: 10 }, { wch: 28 }, { wch: 14 }];
  wsDetail["!cols"] = [{ wch: 12 }, { wch: 28 }, { wch: 10 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, wsSummary, "Summary");
  XLSX.utils.book_append_sheet(wb, wsDetail, "Detail");
  XLSX.writeFile(wb, "time-log-" + new Date().toISOString().slice(0, 10) + ".xlsx");
}

function showModalError(msg) {
  var el = document.getElementById("mError");
  el.textContent = msg;
  el.style.display = "block";
}

// ---------- Init ----------
loadState();
if (state.customers.length === 0 && state.projects.length === 0 && state.actions.length === 0 && state.notes.length === 0) {
  state.customers = ["Mitsui", "KH Roberts", "Wostevia", "MRP Ingredients"].map(function(name) {
    return { id: uid("cus"), name: name };
  });
}
render();
</script>
